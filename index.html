<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Money">
<meta name="theme-color" content="#f5f3ee">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1d1c1a; --muted:#7a766e; --line:#e7e3da;
  --accent:#1f6f5c; --accent-soft:#e3efe9; --exp:#c2553a; --exp-soft:#f6e6e1; --inc:#1f6f5c;
  --warn:#c8902a; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--card:#1e1e1c;--ink:#f1efe9;--muted:#9b978e;--line:#2e2d2a;
  --accent:#5cbf9f;--accent-soft:#1f3530;--exp:#e98a70;--exp-soft:#3a2520;--inc:#5cbf9f;--warn:#e0b25a;
  --shadow:0 1px 2px rgba(0,0,0,.3)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--muted)}
.monthnav button:active{background:var(--line)}
.monthlabel{font-weight:700;font-size:18px;min-width:150px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{background:var(--bg);border-radius:14px;padding:10px 12px}
.mini b{display:block;font-size:17px;margin-top:2px}
.inc{color:var(--inc)} .exp{color:var(--exp)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .3s}
.bar.over i{background:var(--exp)} .bar.near i{background:var(--warn)}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
.cat{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:7px 0}
.cat .ic{font-size:18px;text-align:center}
.cat .nm{font-size:14px;font-weight:600}
.cat .cb{height:5px;border-radius:5px;background:var(--line);margin-top:5px;overflow:hidden}
.cat .cb i{display:block;height:100%;background:var(--exp);border-radius:5px;opacity:.8}
.cat .am{font-size:14px;font-weight:700;text-align:right}
.cat .pc{font-size:11px;color:var(--muted);font-weight:500}
.trend{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.trend .b{width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:var(--exp-soft);min-height:3px}
.trend .col.sel .b{background:var(--exp)}
.trend .m{font-size:11px;color:var(--muted);font-weight:600}
.trend .v{font-size:10px;color:var(--muted)}
.day{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between}
.day:first-child{margin-top:0}
.tx{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tx:last-child{border-bottom:0}
.tx .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px}
.tx .t{font-size:14px;font-weight:600}
.tx .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tx .a{font-weight:700;font-size:15px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:16px 0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);
  background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:16px 28px;border-radius:999px;
  box-shadow:0 8px 24px rgba(31,111,92,.35);display:flex;gap:8px;align-items:center;z-index:5}
@media (prefers-color-scheme:dark){.fab{color:#0f1f1a}}
.notice{font-size:13px;padding:10px 14px;border-radius:12px;background:var(--exp-soft);color:var(--ink);margin-bottom:12px;display:none}
.notice.show{display:block}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .25s ease;
  z-index:11;max-height:92vh;overflow:auto;max-width:600px;margin:0 auto;visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:6px 0;margin-bottom:14px}
.amt:focus-within{border-color:var(--accent)}
.amt input{border:0;background:none;outline:none;font-size:36px;font-weight:800;width:100%;letter-spacing:-.02em}
.amt span{font-size:26px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 12px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;border:1.5px solid transparent}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.field{display:block;margin-bottom:12px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none}
.field input:focus{border-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#0f1f1a}}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.danger{background:var(--exp-soft);color:var(--exp);flex:0 0 auto;padding:14px 18px}
.btn:disabled{opacity:.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-80px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .25s;z-index:20}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="monthnav">
      <button id="prev" aria-label="Previous month">‹</button>
      <div class="monthlabel" id="monthLabel"></div>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <button class="iconbtn" id="openSettings" aria-label="Settings">⚙︎</button>
  </div>

  <div class="notice" id="notice"></div>

  <div class="card">
    <div class="label">Spent this month</div>
    <div class="big exp" id="spent">—</div>
    <div class="bar" id="budgetBar"><i style="width:0"></i></div>
    <div class="sub" id="budgetText"></div>
    <div class="row3">
      <div class="mini"><span class="label">Income</span><b class="inc" id="income">—</b></div>
      <div class="mini"><span class="label">Balance</span><b id="balance">—</b></div>
    </div>
  </div>

  <div class="card">
    <h2>Where it went</h2>
    <div id="cats"></div>
  </div>

  <div class="card">
    <h2>By account</h2>
    <div id="accs"></div>
  </div>

  <div class="card">
    <h2>Last 6 months</h2>
    <div class="trend" id="trend"></div>
  </div>

  <div class="card">
    <h2>Transactions</h2>
    <div id="list"></div>
  </div>
</div>

<button class="fab" id="fab"><span style="font-size:22px;line-height:0">+</span> Add</button>

<div class="overlay" id="overlay"></div>

<!-- Add / edit sheet -->
<div class="sheet" id="txSheet" role="dialog" aria-label="Transaction">
  <div class="grab"></div>
  <div class="seg">
    <button data-type="expense" class="on">Expense</button>
    <button data-type="income">Income</button>
  </div>
  <div class="amt"><input id="amount" inputmode="decimal" placeholder="0" autocomplete="off"><span>₸</span></div>
  <div class="chips" id="catChips"></div>
  <div class="label" style="margin-bottom:8px">Paid from / to</div>
  <div class="chips" id="accChips"></div>
  <label class="field"><input id="note" placeholder="Note (optional)" maxlength="120"></label>
  <label class="field"><input id="date" type="date"></label>
  <div class="actions">
    <button class="btn danger" id="delBtn" style="display:none">Delete</button>
    <button class="btn ghost" id="cancelBtn">Cancel</button>
    <button class="btn" id="saveBtn">Save</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet" id="setSheet" role="dialog" aria-label="Settings">
  <div class="grab"></div>
  <h2>Settings</h2>
  <label class="field"><span class="label">Monthly spending limit (₸)</span>
    <input id="budgetInput" inputmode="numeric" placeholder="e.g. 400 000" style="margin-top:6px"></label>
  <div class="actions" style="margin-bottom:12px">
    <button class="btn" id="saveSettings">Save limit</button>
  </div>
  <div class="label" style="margin:6px 0 8px">Backup (your data lives only on this phone)</div>
  <div class="actions"><button class="btn ghost" id="exportBtn">Save backup file</button></div>
  <div class="actions"><button class="btn ghost" id="importBtn">Restore from backup</button></div>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  <div class="actions"><button class="btn ghost" id="csvBtn">Export this month as CSV</button></div>
  <div class="sub" id="backupInfo" style="margin:4px 0 10px"></div>
  <div class="actions"><button class="btn ghost" id="closeSettings">Close</button></div>
</div>

<!-- Confirm delete -->
<div class="sheet" id="confirmSheet" role="dialog" aria-label="Confirm">
  <div class="grab"></div>
  <h2>Delete this transaction?</h2>
  <div class="actions">
    <button class="btn ghost" id="confirmNo">Keep</button>
    <button class="btn danger" style="flex:1" id="confirmYes">Delete</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {
  expense: [
    {id:"groceries",label:"Groceries",icon:"🛒"},
    {id:"cafe",label:"Coffee & snacks at work",icon:"☕"},
    {id:"taxi",label:"Taxi",icon:"🚕"},
    {id:"bus",label:"Bus",icon:"🚌"},
    {id:"utilities",label:"Utilities",icon:"💡"},
    {id:"internet",label:"Internet",icon:"🌐"},
    {id:"home",label:"Home improvement",icon:"🛠️"},
    {id:"selfcare",label:"Cosmetics & self-care",icon:"💄"},
    {id:"clothes",label:"Clothes",icon:"👗"},
    {id:"gifts",label:"Gifts",icon:"🎁"},
    {id:"mother",label:"Mother",icon:"🤍"},
    {id:"other",label:"Other",icon:"📦"}
  ],
  income: [
    {id:"salary",label:"Salary",icon:"💼"},
    {id:"interest",label:"Deposit interest",icon:"📈"},
    {id:"gift_in",label:"Gift",icon:"🎁"},
    {id:"other_in",label:"Other",icon:"💰"}
  ]
};
const ACCOUNTS = [
  {id:"kaspi",label:"Kaspi",color:"#e2412f"},
  {id:"halyk",label:"Halyk",color:"#1f8a4c"},
  {id:"altyn",label:"Altyn",color:"#c9a227"},
  {id:"cash",label:"Cash",color:"#8a8478"}
];
const ACC_BY_ID = {}; ACCOUNTS.forEach(a => ACC_BY_ID[a.id] = a);
const CAT_BY_ID = {};
[...CATS.expense, ...CATS.income].forEach(c => CAT_BY_ID[c.id] = c);

const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const money = n => nf.format(Math.round(n)) + " ₸";
const short = n => n >= 1e6 ? (n/1e6).toFixed(1).replace(".0","") + "M" : n >= 1e3 ? Math.round(n/1e3) + "k" : String(Math.round(n));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthOf = s => s.slice(0,7);
const shiftMonth = (m, k) => { let [y,mo] = m.split("-").map(Number); mo += k; while(mo<1){mo+=12;y--} while(mo>12){mo-=12;y++} return `${y}-${pad(mo)}`; };
const monthName = (m, opts={month:"long",year:"numeric"}) => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("en-GB",opts); };

const state = {
  month: monthOf(todayStr()),
  tx: [],            // all loaded transactions
  budget: 0,
  ready: true,
  lastBackup: 0,
  editing: null,     // id being edited
  type: "expense",
  cat: "groceries",
  acc: "kaspi"
};

const KEY = "mymoney.v1";
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); state.tx = Array.isArray(s.tx) ? s.tx : []; state.budget = Number(s.budget)||0; state.lastBackup = s.lastBackup || 0; }
  catch { notice("Couldn't read saved data on this phone."); }
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify({tx: state.tx, budget: state.budget, lastBackup: state.lastBackup||0})); return true; }
  catch { notice("Couldn't save on this phone — storage may be full or blocked (Private Browsing?)."); return false; }
}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
function notice(msg){ const n=$("notice"); n.textContent=msg||""; n.classList.toggle("show", !!msg); }

/* ---------- render ---------- */
function render(){
  $("monthLabel").textContent = monthName(state.month);
  const isNow = state.month === monthOf(todayStr());
  $("next").style.visibility = isNow ? "hidden" : "visible";

  const items = state.tx.filter(t => t.month === state.month);
  const spent = items.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const income = items.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  $("spent").textContent = state.ready ? money(spent) : "—";
  $("income").textContent = state.ready ? money(income) : "—";
  const bal = income - spent;
  $("balance").textContent = state.ready ? (bal<0?"−":"") + money(Math.abs(bal)) : "—";
  $("balance").className = bal < 0 ? "exp" : "inc";

  const bar = $("budgetBar"), bt = $("budgetText");
  if (state.budget > 0){
    const p = spent / state.budget;
    bar.style.display = "";
    bar.firstElementChild.style.width = Math.min(100, p*100) + "%";
    bar.className = "bar" + (p > 1 ? " over" : p > .85 ? " near" : "");
    const left = state.budget - spent;
    let txt = left >= 0 ? `${money(left)} left of ${money(state.budget)}` : `${money(-left)} over your ${money(state.budget)} limit`;
    if (isNow && left > 0){
      const d = new Date(); const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      const daysLeft = dim - d.getDate() + 1;
      txt += ` · ~${money(left/daysLeft)}/day for ${daysLeft} day${daysLeft>1?"s":""}`;
    }
    bt.textContent = txt;
  } else {
    bar.style.display = "none";
    bt.innerHTML = `Set a monthly limit in ⚙︎ to track how much is left.`;
  }

  // categories
  const byCat = {};
  items.filter(t=>t.type==="expense").forEach(t => byCat[t.cat] = (byCat[t.cat]||0) + t.amount);
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max = cats.length ? cats[0][1] : 1;
  $("cats").innerHTML = cats.length ? cats.map(([id,v]) => {
    const c = CAT_BY_ID[id] || {label:id, icon:"•"};
    return `<div class="cat"><div class="ic">${c.icon}</div>
      <div><div class="nm">${esc(c.label)} <span class="pc">${spent?Math.round(v/spent*100):0}%</span></div><div class="cb"><i style="width:${v/max*100}%"></i></div></div>
      <div class="am">${money(v)}</div></div>`;
  }).join("") : `<div class="empty">${state.ready ? "No expenses yet this month." : "Loading…"}</div>`;

  // accounts
  $("accs").innerHTML = state.ready ? ACCOUNTS.filter(a => a.id!=="cash" || items.some(t=>t.acc==="cash")).map(a => {
    const out = items.filter(t=>t.type==="expense" && (t.acc||"kaspi")===a.id).reduce((s,t)=>s+t.amount,0);
    const inn = items.filter(t=>t.type==="income" && (t.acc||"kaspi")===a.id).reduce((s,t)=>s+t.amount,0);
    return `<div class="cat"><div class="ic"><span class="dot" style="background:${a.color}"></span></div>
      <div><div class="nm">${a.label}</div><div class="cb"><i style="width:${spent?out/spent*100:0}%;background:${a.color}"></i></div></div>
      <div class="am"><span class="exp">−${money(out)}</span>${inn?`<div class="pc inc">+${money(inn)}</div>`:""}</div></div>`;
  }).join("") : `<div class="empty">Loading…</div>`;

  // trend
  const months = [...Array(6)].map((_,i)=>shiftMonth(state.month, i-5));
  const totals = months.map(m => state.tx.filter(t=>t.month===m && t.type==="expense").reduce((s,t)=>s+t.amount,0));
  const tmax = Math.max(1, ...totals);
  $("trend").innerHTML = months.map((m,i)=>`<div class="col ${m===state.month?"sel":""}">
      <div class="v">${totals[i]?short(totals[i]):""}</div>
      <div class="b" style="height:${totals[i]/tmax*70}%"></div>
      <div class="m">${monthName(m,{month:"short"})}</div></div>`).join("");

  // list
  const sorted = items.slice().sort((a,b)=> b.date.localeCompare(a.date) || (b.created||0)-(a.created||0));
  if (!sorted.length){ $("list").innerHTML = `<div class="empty">${state.ready ? "Tap + Add to log your first one." : "Loading…"}</div>`; return; }
  let html = "", cur = null, dayTotal = {};
  sorted.forEach(t => { if (t.type==="expense") dayTotal[t.date]=(dayTotal[t.date]||0)+t.amount; });
  sorted.forEach(t => {
    if (t.date !== cur){
      cur = t.date;
      const d = new Date(t.date+"T00:00:00");
      const lbl = t.date===todayStr() ? "Today" : d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
      html += `<div class="day"><span>${lbl}</span><span>${dayTotal[t.date]?"−"+money(dayTotal[t.date]):""}</span></div>`;
    }
    const c = CAT_BY_ID[t.cat] || {label:t.cat, icon:"•"};
    html += `<button class="tx" data-id="${esc(t.id)}"><div class="ic">${c.icon}</div>
      <div><div class="t">${esc(c.label)}</div><div class="n">${(ACC_BY_ID[t.acc]||ACC_BY_ID.kaspi).label}${t.note?" · "+esc(t.note):""}</div></div>
      <div class="a ${t.type==="income"?"inc":""}">${t.type==="income"?"+":"−"}${money(t.amount)}</div></button>`;
  });
  $("list").innerHTML = html;
}

/* ---------- sheets ---------- */
let openSheetEl = null;
function openSheet(el){ closeSheet(); openSheetEl = el; el.classList.add("open"); $("overlay").classList.add("open"); }
function closeSheet(){ if(openSheetEl) openSheetEl.classList.remove("open"); openSheetEl=null; $("overlay").classList.remove("open"); }
$("overlay").onclick = closeSheet;

function renderChips(){
  $("catChips").innerHTML = CATS[state.type].map(c =>
    `<button class="chip ${c.id===state.cat?"on":""}" data-cat="${c.id}">${c.icon} ${esc(c.label)}</button>`).join("");
  $("accChips").innerHTML = ACCOUNTS.map(a =>
    `<button class="chip ${a.id===state.acc?"on":""}" data-acc="${a.id}"><span class="dot" style="background:${a.color}"></span> ${a.label}</button>`).join("");
  document.querySelectorAll("#txSheet .seg button").forEach(b => b.classList.toggle("on", b.dataset.type===state.type));
}
$("catChips").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; state.cat = b.dataset.cat; renderChips(); };
$("accChips").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; state.acc = b.dataset.acc; renderChips(); };
document.querySelectorAll("#txSheet .seg button").forEach(b => b.onclick = () => {
  state.type = b.dataset.type; state.cat = CATS[state.type][0].id; renderChips();
});

function openTx(t){
  state.editing = t ? t.id : null;
  state.type = t ? t.type : "expense";
  state.cat = t ? t.cat : (lastExpenseCat() || "groceries");
  if (t && !CATS[state.type].some(c=>c.id===state.cat)) state.cat = CATS[state.type][0].id;
  state.acc = t ? (t.acc || "kaspi") : (lastAcc() || "kaspi");
  $("amount").value = t ? String(t.amount) : "";
  $("note").value = t ? (t.note||"") : "";
  const today = todayStr();
  $("date").value = t ? t.date : (state.month === monthOf(today) ? today : state.month + "-01");
  $("delBtn").style.display = t ? "" : "none";
  renderChips();
  openSheet($("txSheet"));
  if (!t) setTimeout(()=>$("amount").focus(), 260);
}
function lastExpenseCat(){
  const e = state.tx.filter(t=>t.type==="expense").sort((a,b)=>(b.created||0)-(a.created||0))[0];
  return e && e.cat;
}
function lastAcc(){
  const e = state.tx.slice().sort((a,b)=>(b.created||0)-(a.created||0))[0];
  return e && e.acc;
}
$("fab").onclick = () => openTx(null);
$("cancelBtn").onclick = closeSheet;
$("list").onclick = e => { const b = e.target.closest(".tx"); if(!b) return; const t = state.tx.find(x=>x.id===b.dataset.id); if(t) openTx(t); };

$("saveBtn").onclick = () => {
  const amount = parseFloat($("amount").value.replace(/\s/g,"").replace(",", "."));
  if (!(amount > 0)) { toast("Enter an amount"); $("amount").focus(); return; }
  const date = $("date").value || todayStr();
  const existing = state.editing ? state.tx.find(x=>x.id===state.editing) : null;
  const body = { amount: Math.round(amount*100)/100, type: state.type, cat: state.cat, acc: state.acc,
    note: $("note").value.trim(), date, month: monthOf(date), created: existing?.created || Date.now() };
  closeSheet();
  if (existing) Object.assign(existing, body);
  else state.tx.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), ...body });
  if (persist()) toast(existing ? "Updated" : "Saved");
  if (body.month !== state.month) state.month = body.month;
  render();
};

$("delBtn").onclick = () => openSheet($("confirmSheet"));
$("confirmNo").onclick = () => { const t = state.tx.find(x=>x.id===state.editing); closeSheet(); if(t) openTx(t); };
$("confirmYes").onclick = () => {
  const id = state.editing; closeSheet();
  state.tx = state.tx.filter(x=>x.id!==id); persist(); render(); toast("Deleted");
};

/* settings */
$("openSettings").onclick = () => {
  $("budgetInput").value = state.budget ? nf.format(state.budget) : "";
  $("backupInfo").textContent = `${state.tx.length} entries saved on this phone. ` +
    (state.lastBackup ? `Last backup: ${new Date(state.lastBackup).toLocaleDateString("en-GB")}.` : "No backup yet.");
  openSheet($("setSheet"));
};
$("closeSettings").onclick = closeSheet;
$("saveSettings").onclick = () => {
  const v = parseFloat($("budgetInput").value.replace(/\s/g,"").replace(",", ".")) || 0;
  state.budget = Math.max(0, Math.round(v));
  closeSheet(); if (persist()) toast("Limit saved"); render();
};
async function shareOrDownload(name, text, mime){
  const blob = new Blob([text], {type: mime});
  const file = new File([blob], name, {type: mime});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:name}); return true; }
    catch(e){ if (e && e.name === "AbortError") return false; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  return true;
}
$("exportBtn").onclick = async () => {
  const data = JSON.stringify({app:"mymoney", version:1, exported:new Date().toISOString(), budget:state.budget, tx:state.tx});
  if (await shareOrDownload(`my-money-backup-${todayStr()}.json`, data, "application/json")) {
    state.lastBackup = Date.now(); persist(); closeSheet(); toast("Backup ready — save it to Files");
  }
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "mymoney" || !Array.isArray(d.tx)) throw 0;
    const have = new Set(state.tx.map(t=>t.id)); let added = 0;
    d.tx.forEach(t => { if (t && t.id && !have.has(t.id) && t.amount > 0 && t.date) { state.tx.push(t); added++; } });
    if (!state.budget && d.budget) state.budget = Number(d.budget)||0;
    persist(); closeSheet(); render(); toast(`Restored ${added} entr${added===1?"y":"ies"}`);
  } catch { toast("That isn't a My Money backup file"); }
};
$("csvBtn").onclick = () => {
  const rows = state.tx.filter(t=>t.month===state.month).sort((a,b)=>a.date.localeCompare(b.date));
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const csv = ["date,type,category,account,amount,note", ...rows.map(t=>[t.date,t.type,q((CAT_BY_ID[t.cat]||{}).label||t.cat),(ACC_BY_ID[t.acc]||ACC_BY_ID.kaspi).label,t.amount,q(t.note||"")].join(","))].join("\n");
  shareOrDownload(`my-money-${state.month}.csv`, "\ufeff"+csv, "text/csv");
};

/* month nav */
$("prev").onclick = () => { state.month = shiftMonth(state.month,-1); render(); };
$("next").onclick = () => { state.month = shiftMonth(state.month,1); render(); };

/* ---------- start ---------- */
load();
render();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
// gentle monthly backup reminder
if (state.tx.length >= 10 && Date.now() - (state.lastBackup||0) > 30*864e5) setTimeout(()=>toast("Tip: save a backup in ⚙︎"), 1500);
</script>
</body>
</html>
